name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run regression and persistence tests
        run: ./script/test.sh
      - name: Build Xcode project
        run: xcodebuild -project AppAttestDecoder.xcodeproj -scheme AppAttestDecoder -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/xcode build
      - name: Check Xcode project is up to date
        run: python3 script/generate_xcodeproj.py . && git diff --exit-code -- AppAttestDecoder.xcodeproj
